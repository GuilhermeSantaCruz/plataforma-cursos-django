<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Plataforma de Cursos</title>

        {% load static %}
        <link rel="stylesheet" href="{% static 'cursos/style.css' %}">
    </head>
    <body>
        
    <header>
        <h1>Aprenda novas habilidades com nossos cursos</h1>

        <nav>
            <a href="{% url 'home' %}">Início</a>

            {% if user.is_authenticated %}
                <span>Olá, {{ user.first_name|default:user.username }}!</span>

                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit">Sair</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}">Entrar</a>
                <a href="{% url 'cadastro' %}">Criar conta</a>
            {% endif %}
        </nav>
    </header>

        <main>
            {% block content %}
            {% endblock content %}    
        </main>

        <footer>
            <p>&copy; 2026 Plataforma de Cursos</p>
        </footer>
    </body>
</html>
